spring.application.name=helpdesk

# contexto da aplicação
server.servlet.context-path=/helpdesk/api

CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
server.port=${SERVER_PORT}
SECRET=${SECRET}
EXPIRATION_TIME=${EXPIRATION_TIME}

# Database
spring.datasource.url=${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.generate-ddl=false
spring.jpa.hibernate.ddl-auto=none
# Evitar o problema de LazyInitializationException ao acessar entidades relacionadas fora do contexto da transação
spring.jpa.open-in-view=false

logging.level.root=WARN