spring.application.name=helpdesk

# contexto da aplicação
server.servlet.context-path=/helpdesk/api

# Database
spring.datasource.url=jdbc:postgresql://localhost:5432/helpdesk?autoreconnect=true
spring.datasource.username=postgres
spring.datasource.password=159357
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=update
# Evitar o problema de LazyInitializationException ao acessar entidades relacionadas fora do contexto da transação
spring.jpa.open-in-view=false

logging.level.root=WARN